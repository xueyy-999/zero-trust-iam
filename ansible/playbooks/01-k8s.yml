---
- name: 01 - Install Kubernetes (kubeadm, single node)
  hosts: k8s_master
  become: true
  vars:
    kube_version_repo: "https://pkgs.k8s.io/core:/stable:/v1.30/rpm/"
  tasks:
    - name: Ensure base packages
      package:
        name:
          - epel-release
          - python3
          - python3-pip
          - git
          - curl
          - tar
          - jq
          - yum-utils
        state: present

    - name: Set SELinux to permissive
      selinux:
        policy: targeted
        state: permissive

    - name: Stop and disable firewalld
      service:
        name: firewalld
        state: stopped
        enabled: false
      ignore_errors: yes

    - name: Disable swap (required by kubelet)
      command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: false

    - name: Comment swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^(.*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules for k8s
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: modprobe overlay
      command: modprobe overlay
      register: overlay_loaded
      failed_when: false

    - name: modprobe br_netfilter
      command: modprobe br_netfilter
      register: brnf_loaded
      failed_when: false

    - name: Set required sysctl params
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl
      command: sysctl --system

    - name: Install containerd from system repos
      package:
        name:
          - containerd
        state: present
      ignore_errors: yes

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate containerd default config
      shell: |
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml

      args:
        creates: /etc/containerd/config.toml

    - name: Enable containerd service
      systemd:
        name: containerd
        enabled: true
        state: started

    - name: Add Kubernetes repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl={{ kube_version_repo }}
          enabled=1
          gpgcheck=1
          gpgkey={{ kube_version_repo }}repodata/repomd.xml.key

    - name: Install kubelet, kubeadm, kubectl
      package:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: true
        state: stopped

    - name: Initialize cluster (kubeadm init with Podman)
      shell: |
        kubeadm init --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Setup kubeconfig for root
      shell: |
        mkdir -p $HOME/.kube
        cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config
      args:
        executable: /bin/bash

    - name: Install Flannel CNI
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      args:
        creates: /root/kube-flannel-applied
      register: flannel_apply
      changed_when: flannel_apply.rc == 0

    - name: Mark flannel applied
      file:
        path: /root/kube-flannel-applied
        state: touch

    - name: Allow scheduling on control-plane
      shell: |
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
        kubectl taint nodes --all node-role.kubernetes.io/master- || true
      register: untaint
      changed_when: false
