---
- name: 10 - Deploy Apps on Kubernetes
  hosts: k8s_master
  become: true
  tasks:
    - name: Create security namespace
      shell: |
        kubectl create namespace security --dry-run=client -o yaml | kubectl apply -f -

    - name: Create OPA policy configmap
      shell: |
        kubectl -n security create configmap opa-policies --from-file=opa/policies -o yaml --dry-run=client | kubectl apply -f -

    - name: Create MySQL data directory
      file:
        path: /mnt/data/mysql
        state: directory
        mode: '0755'

    - name: Apply MySQL deployment
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          name: mysql-pv
          labels:
            type: local
        spec:
          storageClassName: manual
          capacity:
            storage: 10Gi
          accessModes:
            - ReadWriteOnce
          hostPath:
            path: "/mnt/data/mysql"
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: mysql-root
          namespace: security
        stringData:
          password: "{{ mysql_root_password }}"
        ---
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: mysql-pvc
          namespace: security
        spec:
          storageClassName: manual
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: mysql
          namespace: security
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: mysql
          template:
            metadata:
              labels:
                app: mysql
            spec:
              containers:
                - name: mysql
                  image: {{ mysql_image }}
                  ports:
                    - containerPort: 3306
                  env:
                    - name: MYSQL_ROOT_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: mysql-root
                          key: password
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/mysql
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: mysql-pvc
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: mysql
          namespace: security
        spec:
          selector:
            app: mysql
          ports:
            - port: 3306
              targetPort: 3306
        EOF

    - name: Apply Keycloak deployment
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Secret
        metadata:
          name: keycloak-admin
          namespace: security
        stringData:
          username: "{{ keycloak_admin_user }}"
          password: "{{ keycloak_admin_password }}"
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: keycloak
          namespace: security
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: keycloak
          template:
            metadata:
              labels:
                app: keycloak
            spec:
              containers:
                - name: keycloak
                  image: {{ keycloak_image }}
                  args: ["start-dev"]
                  env:
                    - name: KEYCLOAK_ADMIN
                      valueFrom:
                        secretKeyRef:
                          name: keycloak-admin
                          key: username
                    - name: KEYCLOAK_ADMIN_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: keycloak-admin
                          key: password
                  ports:
                    - containerPort: 8080
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 10
                    periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: keycloak
          namespace: security
        spec:
          selector:
            app: keycloak
          ports:
            - port: 8080
              targetPort: 8080
        EOF

    - name: Apply OPA deployment
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: opa
          namespace: security
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: opa
          template:
            metadata:
              labels:
                app: opa
            spec:
              containers:
                - name: opa
                  image: {{ opa_image }}
                  args: ["run","--server","--addr",":8181","/policies"]
                  ports:
                    - containerPort: 8181
                  volumeMounts:
                    - name: policies
                      mountPath: /policies
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8181
                    initialDelaySeconds: 10
                    periodSeconds: 10
              volumes:
                - name: policies
                  configMap:
                    name: opa-policies
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: opa
          namespace: security
        spec:
          selector:
            app: opa
          ports:
            - port: 8181
              targetPort: 8181
        EOF

    - name: Apply Risk Service deployment
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: risk-service
          namespace: security
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: risk-service
          template:
            metadata:
              labels:
                app: risk-service
            spec:
              containers:
                - name: risk-service
                  image: {{ risk_service_image }}
                  env:
                    - name: PORT
                      value: "{{ risk_service_port }}"
                  ports:
                    - containerPort: {{ risk_service_port }}
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: {{ risk_service_port }}
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: {{ risk_service_port }}
                    initialDelaySeconds: 5
                    periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: risk-service
          namespace: security
        spec:
          selector:
            app: risk-service
          ports:
            - port: 80
              targetPort: {{ risk_service_port }}
        EOF

    - name: Apply Web Portal deployment
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: web-portal
          namespace: security
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: web-portal
          template:
            metadata:
              labels:
                app: web-portal
            spec:
              containers:
                - name: web-portal
                  image: {{ web_portal_image }}
                  env:
                    - name: PORT
                      value: "{{ web_portal_port }}"
                    - name: RISK_SERVICE_URL
                      value: "http://risk-service/score"
                    - name: OPA_URL
                      value: "http://opa:8181"
                    - name: OIDC_ISSUER
                      value: "{{ oidc_issuer }}"
                    - name: OIDC_CLIENT_ID
                      value: "{{ oidc_client_id }}"
                    - name: OIDC_CLIENT_SECRET
                      value: "{{ oidc_client_secret }}"
                    - name: OIDC_REDIRECT_URL
                      value: "{{ oidc_redirect_url }}"
                  ports:
                    - containerPort: {{ web_portal_port }}
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: {{ web_portal_port }}
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: {{ web_portal_port }}
                    initialDelaySeconds: 5
                    periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: web-portal
          namespace: security
        spec:
          type: NodePort
          selector:
            app: web-portal
          ports:
            - port: 80
              targetPort: {{ web_portal_port }}
              nodePort: {{ web_portal_node_port }}
        EOF


    - name: Wait for deployments
      shell: |
        kubectl -n security rollout status deploy/keycloak --timeout=120s || true
        kubectl -n security rollout status deploy/opa --timeout=120s || true
        kubectl -n security rollout status deploy/risk-service --timeout=120s || true
        kubectl -n security rollout status deploy/web-portal --timeout=120s || true
      changed_when: false
