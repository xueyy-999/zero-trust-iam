<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="650" fill="#f8f9fa"/>

  <!-- 标题 -->
  <text x="400" y="40" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">零信任IAM系统 - 数据库表结构</text>

  <!-- audit_logs 表 -->
  <g transform="translate(250, 70)" filter="url(#shadow)">
    <!-- 表框 -->
    <rect width="300" height="420" rx="8" ry="8" fill="white" stroke="#dee2e6" stroke-width="2"/>

    <!-- 表头 -->
    <rect width="300" height="50" rx="8" ry="8" fill="url(#headerGrad)"/>
    <rect y="42" width="300" height="8" fill="url(#headerGrad)"/>
    <text x="150" y="32" font-family="Microsoft YaHei, Consolas, monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="white">audit_logs</text>

    <!-- 字段列表 -->
    <!-- PK: id -->
    <g transform="translate(0, 60)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#fff3cd"/>
      <rect x="15" y="8" width="22" height="18" rx="3" fill="url(#pkGrad)"/>
      <text x="26" y="21" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="#856404" font-weight="bold">PK</text>
      <text x="50" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">id</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">BIGINT AUTO_INCREMENT</text>
    </g>

    <!-- user_id -->
    <g transform="translate(0, 100)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <rect x="15" y="8" width="22" height="18" rx="3" fill="#28a745"/>
      <text x="26" y="21" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="white" font-weight="bold">IDX</text>
      <text x="50" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">user_id</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">VARCHAR(255) NOT NULL</text>
    </g>

    <!-- action -->
    <g transform="translate(0, 140)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <text x="20" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">action</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">VARCHAR(100) NOT NULL</text>
    </g>

    <!-- resource -->
    <g transform="translate(0, 180)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <text x="20" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">resource</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">VARCHAR(255) NOT NULL</text>
    </g>

    <!-- risk_score -->
    <g transform="translate(0, 220)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <rect x="15" y="8" width="22" height="18" rx="3" fill="#28a745"/>
      <text x="26" y="21" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="white" font-weight="bold">IDX</text>
      <text x="50" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">risk_score</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">INT NOT NULL</text>
    </g>

    <!-- decision -->
    <g transform="translate(0, 260)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <text x="20" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">decision</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">VARCHAR(50) NOT NULL</text>
    </g>

    <!-- ip -->
    <g transform="translate(0, 300)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <text x="20" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">ip</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">VARCHAR(45)</text>
    </g>

    <!-- geo -->
    <g transform="translate(0, 340)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <text x="20" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">geo</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">VARCHAR(10)</text>
    </g>

    <!-- failed_login_count -->
    <g transform="translate(0, 380)">
      <rect x="10" y="0" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <text x="20" y="22" font-family="Consolas, monospace" font-size="14" fill="#333">failed_login_count</text>
      <text x="280" y="22" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">INT DEFAULT 0</text>
    </g>

    <!-- timestamp -->
    <g transform="translate(0, 420)">
      <rect x="10" y="-5" width="280" height="35" rx="4" fill="#f8f9fa"/>
      <rect x="15" y="3" width="22" height="18" rx="3" fill="#28a745"/>
      <text x="26" y="16" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="white" font-weight="bold">IDX</text>
      <text x="50" y="17" font-family="Consolas, monospace" font-size="14" fill="#333">timestamp</text>
      <text x="280" y="17" font-family="Consolas, monospace" font-size="12" text-anchor="end" fill="#6c757d">TIMESTAMP DEFAULT NOW</text>
    </g>
  </g>

  <!-- 索引说明 -->
  <g transform="translate(50, 520)">
    <rect width="700" height="110" rx="8" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
    <text x="20" y="25" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold" fill="#495057">索引设计</text>

    <g transform="translate(20, 40)">
      <rect width="22" height="18" rx="3" fill="url(#pkGrad)"/>
      <text x="11" y="13" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="#856404" font-weight="bold">PK</text>
      <text x="35" y="14" font-family="Microsoft YaHei, Consolas" font-size="12" fill="#333">PRIMARY KEY (id) - 主键，自增</text>
    </g>

    <g transform="translate(20, 65)">
      <rect width="22" height="18" rx="3" fill="#28a745"/>
      <text x="11" y="13" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="white" font-weight="bold">IDX</text>
      <text x="35" y="14" font-family="Microsoft YaHei, Consolas" font-size="12" fill="#333">idx_user_id (user_id) - 用户查询优化</text>
    </g>

    <g transform="translate(350, 40)">
      <rect width="22" height="18" rx="3" fill="#28a745"/>
      <text x="11" y="13" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="white" font-weight="bold">IDX</text>
      <text x="35" y="14" font-family="Microsoft YaHei, Consolas" font-size="12" fill="#333">idx_timestamp (timestamp) - 时间范围查询</text>
    </g>

    <g transform="translate(350, 65)">
      <rect width="22" height="18" rx="3" fill="#28a745"/>
      <text x="11" y="13" font-family="Consolas, monospace" font-size="9" text-anchor="middle" fill="white" font-weight="bold">IDX</text>
      <text x="35" y="14" font-family="Microsoft YaHei, Consolas" font-size="12" fill="#333">idx_risk_score (risk_score) - 风险分析查询</text>
    </g>

    <text x="20" y="95" font-family="Microsoft YaHei, Consolas" font-size="11" fill="#6c757d">存储引擎: InnoDB | 字符集: utf8mb4 | 支持事务和外键约束</text>
  </g>
</svg>
