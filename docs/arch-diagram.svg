<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .box { fill: #f5f7fb; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .title { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 18px; fill: #0f172a; }
      .label { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #334155; }
      .small { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Left: User -->
  <rect class="box" x="30" y="280" width="140" height="80" />
  <text class="title" x="100" y="325" text-anchor="middle">??/???</text>

  <!-- Internet cloud -->
  <rect class="box" x="210" y="275" width="140" height="90" />
  <text class="title" x="280" y="315" text-anchor="middle">Internet</text>

  <!-- Kubernetes cluster frame -->
  <rect x="380" y="60" width="740" height="560" fill="none" stroke="#1e293b" stroke-width="2" rx="12" />
  <text class="title" x="400" y="40">Kubernetes ??</text>

  <!-- Components inside cluster -->
  <rect class="box" x="430" y="120" width="220" height="80" />
  <text class="title" x="540" y="165" text-anchor="middle">Web Portal</text>
  <text class="small" x="540" y="185" text-anchor="middle">????</text>

  <rect class="box" x="740" y="120" width="220" height="80" />
  <text class="title" x="850" y="165" text-anchor="middle">Keycloak</text>
  <text class="small" x="850" y="185" text-anchor="middle">????</text>

  <rect class="box" x="430" y="260" width="220" height="80" />
  <text class="title" x="540" y="305" text-anchor="middle">Risk Service</text>
  <text class="small" x="540" y="325" text-anchor="middle">????</text>

  <rect class="box" x="740" y="260" width="220" height="80" />
  <text class="title" x="850" y="305" text-anchor="middle">OPA</text>
  <text class="small" x="850" y="325" text-anchor="middle">????</text>

  <rect class="box" x="585" y="420" width="220" height="80" />
  <text class="title" x="695" y="465" text-anchor="middle">MySQL</text>
  <text class="small" x="695" y="485" text-anchor="middle">????</text>

  <!-- Lines -->
  <line class="line" x1="170" y1="320" x2="210" y2="320" />
  <line class="line" x1="350" y1="320" x2="430" y2="160" />

  <line class="line dash" x1="540" y1="160" x2="740" y2="160" />
  <text class="small" x="640" y="145" text-anchor="middle">????</text>

  <line class="line" x1="540" y1="200" x2="540" y2="260" />
  <text class="small" x="560" y="235">????</text>

  <line class="line" x1="650" y1="300" x2="740" y2="300" />
  <text class="small" x="695" y="285" text-anchor="middle">????</text>

  <line class="line" x1="850" y1="340" x2="540" y2="340" />
  <text class="small" x="695" y="360" text-anchor="middle">??/??</text>

  <line class="line" x1="540" y1="340" x2="695" y2="420" />
  <text class="small" x="620" y="400" text-anchor="middle">????</text>

  <!-- Annotation -->
  <text class="label" x="430" y="610">Ansible ??????????</text>
</svg>
