    <text x="28" y="186" font-family="Consolas, monospace" font-size="11" fill="#b5cea8">8</text>
    <text x="42" y="186" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="52" y="186" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">bob</text>
    <text x="115" y="186" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
