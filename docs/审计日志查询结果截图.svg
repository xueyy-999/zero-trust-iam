    <text x="185" y="220" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">/api/reports</text>
    <text x="285" y="220" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="310" y="220" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">20</text>
    <text x="355" y="220" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="370" y="220" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">allow</text>
    <text x="425" y="220" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="435" y="220" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">10.0.0.55</text>
    <text x="555" y="220" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="565" y="220" font-family="Consolas, monospace" font-size="11" fill="#6a9955">2026-02-09 09:45:33</text>
    <text x="720" y="220" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>

    <!-- 数据行6 -->
    <text x="15" y="237" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="28" y="237" font-family="Consolas, monospace" font-size="11" fill="#b5cea8">5</text>
