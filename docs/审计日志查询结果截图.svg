    <!-- 查询结果统计 -->
    <text x="15" y="275" font-family="Consolas, monospace" font-size="11" fill="#569cd6">6 rows in set (0.02 sec)</text>

    <!-- 风险等级图例 -->
    <g transform="translate(15, 300)">
      <rect width="810" height="95" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
      <text x="15" y="22" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="bold" fill="#cccccc">风险等级说明</text>

      <g transform="translate(15, 38)">
        <rect width="16" height="16" rx="3" fill="#f14c4c"/>
        <text x="25" y="13" font-family="Microsoft YaHei, Consolas" font-size="12" fill="#d4d4d4">高风险 (score ≥ 70): 拒绝访问，记录告警</text>
