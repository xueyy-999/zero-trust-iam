<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terminalHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d3d3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="500" fill="#1a1a2e"/>

  <!-- 标题 -->
  <text x="450" y="35" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">审计日志查询结果</text>

  <!-- 终端窗口 -->
  <g transform="translate(30, 55)">
    <!-- 窗口边框 -->
    <rect width="840" height="420" rx="8" ry="8" fill="#1e1e1e" stroke="#444" stroke-width="2"/>

    <!-- 终端标题栏 -->
    <rect width="840" height="35" rx="8" ry="8" fill="url(#terminalHeader)"/>
    <rect y="27" width="840" height="8" fill="url(#terminalHeader)"/>

    <!-- 窗口按钮 -->
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27ca40"/>

    <!-- 标题文字 -->
    <text x="420" y="22" font-family="Consolas, monospace" font-size="13" text-anchor="middle" fill="#aaa">MySQL - audit_logs 查询结果</text>

    <!-- SQL 查询语句 -->
    <text x="15" y="60" font-family="Consolas, monospace" font-size="12" fill="#569cd6">mysql&gt;</text>
    <text x="70" y="60" font-family="Consolas, monospace" font-size="12" fill="#ce9178">SELECT</text>
    <text x="120" y="60" font-family="Consolas, monospace" font-size="12" fill="#dcdcaa">id, user_id, action, resource, risk_score, decision, ip, timestamp</text>
    <text x="15" y="78" font-family="Consolas, monospace" font-size="12" fill="#ce9178">       FROM</text>
    <text x="85" y="78" font-family="Consolas, monospace" font-size="12" fill="#4ec9b0">audit_logs</text>
    <text x="175" y="78" font-family="Consolas, monospace" font-size="12" fill="#ce9178">ORDER BY</text>
    <text x="265" y="78" font-family="Consolas, monospace" font-size="12" fill="#dcdcaa">timestamp</text>
    <text x="340" y="78" font-family="Consolas, monospace" font-size="12" fill="#ce9178">DESC</text>
    <text x="375" y="78" font-family="Consolas, monospace" font-size="12" fill="#ce9178">LIMIT</text>
    <text x="420" y="78" font-family="Consolas, monospace" font-size="12" fill="#b5cea8">10</text>
    <text x="440" y="78" font-family="Consolas, monospace" font-size="12" fill="#dcdcaa">;</text>

    <!-- 表格分隔线 -->
    <text x="15" y="105" font-family="Consolas, monospace" font-size="11" fill="#608b4e">+----+----------+--------+-------------+------------+----------+----------------+---------------------+</text>

    <!-- 表头 -->
    <text x="15" y="120" font-family="Consolas, monospace" font-size="11" fill="#4fc1ff">| id | user_id  | action | resource    | risk_score | decision | ip             | timestamp           |</text>
    <text x="15" y="135" font-family="Consolas, monospace" font-size="11" fill="#608b4e">+----+----------+--------+-------------+------------+----------+----------------+---------------------+</text>

    <!-- 数据行1 - 高风险 拒绝 -->
    <text x="15" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="25" y="152" font-family="Consolas, monospace" font-size="11" fill="#b5cea8">10</text>
    <text x="42" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="52" y="152" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">hacker01</text>
    <text x="115" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="125" y="152" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">admin</text>
    <text x="175" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="185" y="152" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">/api/users</text>
