      <g transform="translate(300, 38)">
        <rect width="16" height="16" rx="3" fill="#cca700"/>
        <text x="25" y="13" font-family="Microsoft YaHei, Consolas" font-size="12" fill="#d4d4d4">中风险 (40 ≤ score &lt; 70): 允许但需要MFA</text>
      </g>

      <g transform="translate(580, 38)">
