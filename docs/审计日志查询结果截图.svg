    <text x="185" y="186" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">/api/profile</text>
    <text x="285" y="186" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="310" y="186" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">15</text>
    <text x="355" y="186" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="370" y="186" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">allow</text>
    <text x="425" y="186" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="435" y="186" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">192.168.1.88</text>
    <text x="555" y="186" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="565" y="186" font-family="Consolas, monospace" font-size="11" fill="#6a9955">2026-02-09 09:52:45</text>
    <text x="720" y="186" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>

    <!-- 数据行4 - 高风险 拒绝 -->
    <text x="15" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="28" y="203" font-family="Consolas, monospace" font-size="11" fill="#b5cea8">7</text>
    <text x="42" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="52" y="203" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">unknown</text>
    <text x="115" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="125" y="203" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">delete</text>
    <text x="175" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="185" y="203" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">/api/config</text>
    <text x="285" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="310" y="203" font-family="Consolas, monospace" font-size="11" fill="#f14c4c" filter="url(#glow)">92</text>
    <text x="355" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="370" y="203" font-family="Consolas, monospace" font-size="11" fill="#f14c4c">deny</text>
    <text x="425" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="435" y="203" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">45.33.32.156</text>
    <text x="555" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="565" y="203" font-family="Consolas, monospace" font-size="11" fill="#6a9955">2026-02-09 09:48:12</text>
    <text x="720" y="203" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>

    <!-- 数据行5 - 低风险 允许 -->
    <text x="15" y="220" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="28" y="220" font-family="Consolas, monospace" font-size="11" fill="#b5cea8">6</text>
    <text x="42" y="220" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
