    <text x="175" y="169" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="185" y="169" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">/api/orders</text>
    <text x="285" y="169" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="310" y="169" font-family="Consolas, monospace" font-size="11" fill="#cca700">45</text>
    <text x="355" y="169" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="370" y="169" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">allow</text>
    <text x="425" y="169" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="435" y="169" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">192.168.1.105</text>
