    <text x="310" y="152" font-family="Consolas, monospace" font-size="11" fill="#f14c4c" filter="url(#glow)">85</text>
    <text x="355" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="370" y="152" font-family="Consolas, monospace" font-size="11" fill="#f14c4c">deny</text>
    <text x="425" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="435" y="152" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">185.220.101.1</text>
    <text x="555" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="565" y="152" font-family="Consolas, monospace" font-size="11" fill="#6a9955">2026-02-09 09:58:32</text>
    <text x="720" y="152" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>

    <!-- 数据行2 - 中风险 允许 -->
    <text x="15" y="169" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="28" y="169" font-family="Consolas, monospace" font-size="11" fill="#b5cea8">9</text>
    <text x="42" y="169" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
    <text x="52" y="169" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">alice</text>
    <text x="115" y="169" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">|</text>
