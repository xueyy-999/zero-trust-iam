<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="500" height="600" fill="#F8FAFC"/>

  <!-- 标题 -->
  <text x="250" y="35" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="bold" fill="#1E293B">系统架构图</text>

  <!-- 用户门户 -->
  <rect x="150" y="55" width="200" height="50" rx="25" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="250" y="85" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="white">用户门户</text>

  <!-- 箭头1 -->
  <path d="M250 105 L250 135" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="125" font-family="Microsoft YaHei, Arial" font-size="11" fill="#64748B">发起请求</text>

  <!-- 箭头标记 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <!-- 登录认证服务 -->
  <rect x="125" y="140" width="250" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="165" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="white">登录认证服务</text>
  <text x="250" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.85)">Keycloak OIDC</text>

  <!-- 箭头2 -->
  <path d="M250 200 L250 235" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="222" font-family="Microsoft YaHei, Arial" font-size="11" fill="#64748B">认证成功</text>

  <!-- 风险评估服务 -->
  <rect x="125" y="240" width="250" height="90" rx="10" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="250" y="268" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="white">风险评估服务</text>
  <text x="250" y="288" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.85)">Risk Service (Go)</text>
  <!-- 风险因素小标签 -->
  <rect x="140" y="298" width="220" height="24" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="250" y="315" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="9" fill="white">失败登录 | 地理位置 | 时间 | 设备 | 权限</text>

  <!-- 箭头3 -->
  <path d="M250 330 L250 365" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="352" font-family="Microsoft YaHei, Arial" font-size="11" fill="#64748B">输出风险评分</text>

  <!-- 策略引擎 -->
  <rect x="125" y="370" width="250" height="60" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="250" y="395" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="white">策略引擎</text>
  <text x="250" y="415" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.85)">OPA ABAC</text>

  <!-- 箭头4 -->
  <path d="M250 430 L250 465" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="452" font-family="Microsoft YaHei, Arial" font-size="11" fill="#64748B">决策结果</text>

  <!-- 结果展示服务 -->
  <rect x="125" y="470" width="250" height="50" rx="10" fill="url(#pinkGrad)" filter="url(#shadow)"/>
  <text x="250" y="500" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="white">结果展示 + 审计日志</text>

  <!-- 数据库图标 -->
  <ellipse cx="250" cy="555" rx="40" ry="12" fill="#475569" filter="url(#shadow)"/>
  <rect x="210" y="545" width="80" height="20" fill="#475569"/>
  <ellipse cx="250" cy="545" rx="40" ry="12" fill="#64748B"/>
  <text x="250" y="550" text-anchor="middle" font-family="Arial" font-size="10" fill="white">MySQL</text>

  <!-- 箭头5 到数据库 -->
  <path d="M250 520 L250 533" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 右侧返回箭头 -->
  <path d="M375 285 Q420 285 420 170 Q420 80 375 80" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
    </marker>
  </defs>
  <text x="435" y="180" font-family="Microsoft YaHei, Arial" font-size="10" fill="#94A3B8">返回页面</text>

</svg>