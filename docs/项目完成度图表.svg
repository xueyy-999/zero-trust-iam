<?xml version="1.0" encoding="UTF-8"?>
<svg width="950" height="750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e4e8ed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="progressGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="progressBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2980b9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="progressOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d35400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="progressPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="950" height="750" fill="url(#bgGrad)"/>

  <!-- 标题 -->
  <text x="475" y="40" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">零信任IAM系统 - 项目完成度</text>
  <text x="475" y="65" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">基于零信任架构的身份认证与授权系统设计与实现</text>

  <!-- 总体完成度饼图区域 -->
  <g transform="translate(475, 220)">
    <!-- 饼图背景圆 -->
    <circle cx="0" cy="0" r="120" fill="#ecf0f1" filter="url(#innerShadow)"/>

    <!-- 完成部分 95% = 342度 -->
    <path d="M 0 -120 A 120 120 0 1 1 -37.08 -114.13 L 0 0 Z" fill="#27ae60"/>

    <!-- 未完成部分 5% -->
    <path d="M -37.08 -114.13 A 120 120 0 0 1 0 -120 L 0 0 Z" fill="#e74c3c"/>

    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="80" fill="white" filter="url(#shadow)"/>

    <!-- 百分比文字 -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#27ae60">95%</text>
    <text x="0" y="30" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">总体完成度</text>
  </g>

  <!-- 饼图图例 -->
  <g transform="translate(650, 160)">
    <rect x="0" y="0" width="20" height="20" rx="4" fill="#27ae60"/>
    <text x="30" y="15" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#333">已完成 (95%)</text>

    <rect x="0" y="30" width="20" height="20" rx="4" fill="#e74c3c"/>
    <text x="30" y="45" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#333">待完成 (5%)</text>
  </g>

  <!-- 分隔线 -->
  <line x1="50" y1="360" x2="900" y2="360" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- 各模块进度条区域标题 -->
  <text x="475" y="395" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">各模块完成状态</text>

  <!-- 模块1: 身份认证模块 (Keycloak) - 100% -->
  <g transform="translate(50, 420)">
    <text x="0" y="15" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#333">身份认证模块 (Keycloak)</text>
    <text x="850" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#27ae60">100%</text>

    <!-- 进度条背景 -->
    <rect x="0" y="22" width="850" height="20" rx="10" fill="#ecf0f1" filter="url(#innerShadow)"/>
    <!-- 进度条填充 -->
    <rect x="0" y="22" width="850" height="20" rx="10" fill="url(#progressGreen)"/>
    <!-- 完成标记 -->
    <text x="830" y="37" font-family="sans-serif" font-size="12" fill="white">✓</text>
  </g>

  <!-- 模块2: 风险评估模块 (Risk Service) - 100% -->
  <g transform="translate(50, 475)">
    <text x="0" y="15" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#333">风险评估模块 (Risk Service)</text>
    <text x="850" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#27ae60">100%</text>

    <rect x="0" y="22" width="850" height="20" rx="10" fill="#ecf0f1" filter="url(#innerShadow)"/>
    <rect x="0" y="22" width="850" height="20" rx="10" fill="url(#progressGreen)"/>
    <text x="830" y="37" font-family="sans-serif" font-size="12" fill="white">✓</text>
  </g>

  <!-- 模块3: 授权决策模块 (OPA) - 100% -->
  <g transform="translate(50, 530)">
    <text x="0" y="15" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#333">授权决策模块 (OPA)</text>
    <text x="850" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#27ae60">100%</text>

    <rect x="0" y="22" width="850" height="20" rx="10" fill="#ecf0f1" filter="url(#innerShadow)"/>
    <rect x="0" y="22" width="850" height="20" rx="10" fill="url(#progressGreen)"/>
    <text x="830" y="37" font-family="sans-serif" font-size="12" fill="white">✓</text>
  </g>

  <!-- 模块4: Web门户模块 - 100% -->
  <g transform="translate(50, 585)">
    <text x="0" y="15" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#333">Web门户模块 (Web Portal)</text>
    <text x="850" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#27ae60">100%</text>

    <rect x="0" y="22" width="850" height="20" rx="10" fill="#ecf0f1" filter="url(#innerShadow)"/>
    <rect x="0" y="22" width="850" height="20" rx="10" fill="url(#progressGreen)"/>
    <text x="830" y="37" font-family="sans-serif" font-size="12" fill="white">✓</text>
  </g>

  <!-- 模块5: 数据存储模块 (MySQL) - 85% -->
  <g transform="translate(50, 640)">
    <text x="0" y="15" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#333">数据存储模块 (MySQL + 审计日志)</text>
    <text x="850" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#3498db">85%</text>

    <rect x="0" y="22" width="850" height="20" rx="10" fill="#ecf0f1" filter="url(#innerShadow)"/>
    <rect x="0" y="22" width="722.5" height="20" rx="10" fill="url(#progressBlue)"/>
  </g>

  <!-- 模块6: 文档编写 - 100% -->
  <g transform="translate(50, 695)">
    <text x="0" y="15" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#333">文档编写 (15个文档，约100页)</text>
    <text x="850" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#27ae60">100%</text>

    <rect x="0" y="22" width="850" height="20" rx="10" fill="#ecf0f1" filter="url(#innerShadow)"/>
    <rect x="0" y="22" width="850" height="20" rx="10" fill="url(#progressGreen)"/>
    <text x="830" y="37" font-family="sans-serif" font-size="12" fill="white">✓</text>
  </g>

  <!-- 左侧小饼图区域 - 功能分布 -->
  <g transform="translate(160, 220)">
    <!-- 小饼图标题 -->
    <text x="0" y="-100" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">功能模块分布</text>

    <!-- 饼图 - 6个模块 -->
    <circle cx="0" cy="0" r="70" fill="#ecf0f1"/>

    <!-- 身份认证 60度 -->
    <path d="M 0 -70 A 70 70 0 0 1 60.62 -35 L 0 0 Z" fill="#3498db"/>
    <!-- 风险评估 60度 -->
    <path d="M 60.62 -35 A 70 70 0 0 1 60.62 35 L 0 0 Z" fill="#e74c3c"/>
    <!-- 授权决策 60度 -->
    <path d="M 60.62 35 A 70 70 0 0 1 0 70 L 0 0 Z" fill="#9b59b6"/>
    <!-- Web门户 60度 -->
    <path d="M 0 70 A 70 70 0 0 1 -60.62 35 L 0 0 Z" fill="#27ae60"/>
    <!-- 数据存储 60度 -->
    <path d="M -60.62 35 A 70 70 0 0 1 -60.62 -35 L 0 0 Z" fill="#f39c12"/>
    <!-- 文档 60度 -->
    <path d="M -60.62 -35 A 70 70 0 0 1 0 -70 L 0 0 Z" fill="#1abc9c"/>

    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="35" fill="white"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">6</text>
    <text x="0" y="20" font-family="Microsoft YaHei, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">模块</text>
  </g>

  <!-- 左侧小饼图图例 -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#3498db"/>
    <text x="18" y="11" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">身份认证</text>

    <rect x="0" y="18" width="12" height="12" rx="2" fill="#e74c3c"/>
    <text x="18" y="29" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">风险评估</text>

    <rect x="0" y="36" width="12" height="12" rx="2" fill="#9b59b6"/>
    <text x="18" y="47" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">授权决策</text>

    <rect x="100" y="0" width="12" height="12" rx="2" fill="#27ae60"/>
    <text x="118" y="11" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">Web门户</text>

    <rect x="100" y="18" width="12" height="12" rx="2" fill="#f39c12"/>
    <text x="118" y="29" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">数据存储</text>

    <rect x="100" y="36" width="12" height="12" rx="2" fill="#1abc9c"/>
    <text x="118" y="47" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">文档编写</text>
  </g>

  <!-- 状态说明 -->
  <g transform="translate(750, 120)">
    <rect width="170" height="90" rx="8" fill="white" filter="url(#shadow)"/>
    <text x="85" y="22" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">状态说明</text>

    <rect x="15" y="35" width="50" height="8" rx="4" fill="#27ae60"/>
    <text x="75" y="43" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">已完成</text>

    <rect x="15" y="52" width="50" height="8" rx="4" fill="#3498db"/>
    <text x="75" y="60" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">进行中</text>

    <rect x="15" y="69" width="50" height="8" rx="4" fill="#e74c3c"/>
    <text x="75" y="77" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">待完成</text>
  </g>

  <!-- 底部统计信息 -->
  <g transform="translate(50, 740)">
    <text x="0" y="0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7f8c8d">代码量: ~2,225行 | 文档: 15个/约100页 | 测试通过率: 100% | 部署时间: 25分钟</text>
  </g>
</svg>
