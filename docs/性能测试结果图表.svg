<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1e293b; }
      .subtitle { font: 16px sans-serif; fill: #475569; }
      .chart-title { font: bold 16px sans-serif; fill: #1e293b; }
      .label { font: 12px sans-serif; fill: #64748b; }
      .value { font: bold 14px sans-serif; fill: #334155; }
      .metric-title { font: bold 14px sans-serif; fill: #1e293b; }
      .metric-value { font: bold 24px sans-serif; }
      .axis-label { font: 11px sans-serif; fill: #64748b; }
      .bar { fill: #3b82f6; }
      .bar-success { fill: #10b981; }
      .bar-warning { fill: #f59e0b; }
      .line { stroke: #3b82f6; stroke-width: 3; fill: none; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .card { fill: white; stroke: #e2e8f0; stroke-width: 2; rx: 8; }
      .badge-success { fill: #10b981; }
      .badge-info { fill: #3b82f6; }
      .badge-warning { fill: #f59e0b; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="title">性能测试结果报告</text>
  <text x="700" y="65" text-anchor="middle" class="subtitle">Performance Test Results - Risk Service Benchmark</text>

  <!-- Key Metrics Cards -->
  <g id="key-metrics">
    <!-- Response Time -->
    <rect x="50" y="100" width="300" height="140" class="card"/>
    <text x="200" y="130" text-anchor="middle" class="metric-title">平均响应时间</text>
    <text x="200" y="175" text-anchor="middle" class="metric-value" fill="#10b981">42ms</text>
    <text x="200" y="205" text-anchor="middle" class="label">Average Response Time</text>
    <rect x="120" y="215" width="160" height="10" fill="#e2e8f0" rx="5"/>
    <rect x="120" y="215" width="140" height="10" fill="#10b981" rx="5"/>
    <text x="200" y="240" text-anchor="middle" class="label" font-size="10">目标: &lt;50ms ✓</text>

    <!-- Throughput -->
    <rect x="380" y="100" width="300" height="140" class="card"/>
    <text x="530" y="130" text-anchor="middle" class="metric-title">吞吐量</text>
    <text x="530" y="175" text-anchor="middle" class="metric-value" fill="#3b82f6">120 QPS</text>
    <text x="530" y="205" text-anchor="middle" class="label">Queries Per Second</text>
    <rect x="450" y="215" width="160" height="10" fill="#e2e8f0" rx="5"/>
    <rect x="450" y="215" width="150" height="10" fill="#3b82f6" rx="5"/>
    <text x="530" y="240" text-anchor="middle" class="label" font-size="10">目标: &gt;100 QPS ✓</text>

    <!-- Error Rate -->
    <rect x="710" y="100" width="300" height="140" class="card"/>
    <text x="860" y="130" text-anchor="middle" class="metric-title">错误率</text>
    <text x="860" y="175" text-anchor="middle" class="metric-value" fill="#10b981">0%</text>
    <text x="860" y="205" text-anchor="middle" class="label">Error Rate</text>
    <rect x="780" y="215" width="160" height="10" fill="#e2e8f0" rx="5"/>
    <rect x="780" y="215" width="0" height="10" fill="#ef4444" rx="5"/>
    <text x="860" y="240" text-anchor="middle" class="label" font-size="10">0 / 1000 请求失败 ✓</text>

    <!-- Success Rate -->
    <rect x="1040" y="100" width="300" height="140" class="card"/>
    <text x="1190" y="130" text-anchor="middle" class="metric-title">成功率</text>
    <text x="1190" y="175" text-anchor="middle" class="metric-value" fill="#10b981">100%</text>
    <text x="1190" y="205" text-anchor="middle" class="label">Success Rate</text>
    <rect x="1110" y="215" width="160" height="10" fill="#e2e8f0" rx="5"/>
    <rect x="1110" y="215" width="160" height="10" fill="#10b981" rx="5"/>
    <text x="1190" y="240" text-anchor="middle" class="label" font-size="10">1000 / 1000 成功 ✓</text>
  </g>

  <!-- Response Time Distribution Chart -->
  <g id="response-time-chart">
    <rect x="50" y="270" width="640" height="300" class="card"/>
    <text x="370" y="300" text-anchor="middle" class="chart-title">响应时间分布 (Response Time Distribution)</text>

    <!-- Grid lines -->
    <line x1="100" y1="330" x2="100" y2="530" class="grid"/>
    <line x1="100" y1="530" x2="640" y2="530" class="grid"/>
    <line x1="100" y1="480" x2="640" y2="480" class="grid" stroke-dasharray="2,2"/>
    <line x1="100" y1="430" x2="640" y2="430" class="grid" stroke-dasharray="2,2"/>
    <line x1="100" y1="380" x2="640" y2="380" class="grid" stroke-dasharray="2,2"/>
    <line x1="100" y1="330" x2="640" y2="330" class="grid" stroke-dasharray="2,2"/>

    <!-- Y-axis labels -->
    <text x="85" y="535" text-anchor="end" class="axis-label">0ms</text>
    <text x="85" y="485" text-anchor="end" class="axis-label">25ms</text>
    <text x="85" y="435" text-anchor="end" class="axis-label">50ms</text>
    <text x="85" y="385" text-anchor="end" class="axis-label">75ms</text>
    <text x="85" y="335" text-anchor="end" class="axis-label">100ms</text>

    <!-- Bars -->
    <rect x="120" y="450" width="60" height="80" class="bar-success"/>
    <text x="150" y="545" text-anchor="middle" class="axis-label">P50</text>
    <text x="150" y="440" text-anchor="middle" class="value" fill="#10b981">38ms</text>

    <rect x="200" y="440" width="60" height="90" class="bar-success"/>
    <text x="230" y="545" text-anchor="middle" class="axis-label">P75</text>
    <text x="230" y="430" text-anchor="middle" class="value" fill="#10b981">42ms</text>

    <rect x="280" y="420" width="60" height="110" class="bar-success"/>
    <text x="310" y="545" text-anchor="middle" class="axis-label">P90</text>
    <text x="310" y="410" text-anchor="middle" class="value" fill="#10b981">48ms</text>

    <rect x="360" y="400" width="60" height="130" class="bar-warning"/>
    <text x="390" y="545" text-anchor="middle" class="axis-label">P95</text>
    <text x="390" y="390" text-anchor="middle" class="value" fill="#f59e0b">55ms</text>

    <rect x="440" y="380" width="60" height="150" class="bar-warning"/>
    <text x="470" y="545" text-anchor="middle" class="axis-label">P99</text>
    <text x="470" y="370" text-anchor="middle" class="value" fill="#f59e0b">62ms</text>

    <rect x="520" y="360" width="60" height="170" class="bar"/>
    <text x="550" y="545" text-anchor="middle" class="axis-label">Max</text>
    <text x="550" y="350" text-anchor="middle" class="value" fill="#3b82f6">68ms</text>
  </g>

  <!-- Throughput Over Time Chart -->
  <g id="throughput-chart">
    <rect x="720" y="270" width="620" height="300" class="card"/>
    <text x="1030" y="300" text-anchor="middle" class="chart-title">吞吐量趋势 (Throughput Over Time)</text>

    <!-- Grid -->
    <line x1="770" y1="330" x2="770" y2="530" class="grid"/>
    <line x1="770" y1="530" x2="1290" y2="530" class="grid"/>
    <line x1="770" y1="480" x2="1290" y2="480" class="grid" stroke-dasharray="2,2"/>
    <line x1="770" y1="430" x2="1290" y2="430" class="grid" stroke-dasharray="2,2"/>
    <line x1="770" y1="380" x2="1290" y2="380" class="grid" stroke-dasharray="2,2"/>
    <line x1="770" y1="330" x2="1290" y2="330" class="grid" stroke-dasharray="2,2"/>

    <!-- Y-axis labels -->
    <text x="755" y="535" text-anchor="end" class="axis-label">0</text>
    <text x="755" y="485" text-anchor="end" class="axis-label">50</text>
    <text x="755" y="435" text-anchor="end" class="axis-label">100</text>
    <text x="755" y="385" text-anchor="end" class="axis-label">150</text>
    <text x="755" y="335" text-anchor="end" class="axis-label">200 QPS</text>

    <!-- Line chart -->
    <polyline points="770,490 850,470 930,450 1010,440 1090,435 1170,430 1250,428 1290,425" class="line"/>

    <!-- Data points -->
    <circle cx="770" cy="490" r="4" fill="#3b82f6"/>
    <circle cx="850" cy="470" r="4" fill="#3b82f6"/>
    <circle cx="930" cy="450" r="4" fill="#3b82f6"/>
    <circle cx="1010" cy="440" r="4" fill="#3b82f6"/>
    <circle cx="1090" cy="435" r="4" fill="#3b82f6"/>
    <circle cx="1170" cy="430" r="4" fill="#3b82f6"/>
    <circle cx="1250" cy="428" r="4" fill="#3b82f6"/>
    <circle cx="1290" cy="425" r="4" fill="#3b82f6"/>

    <!-- X-axis labels -->
    <text x="770" y="545" text-anchor="middle" class="axis-label">0s</text>
    <text x="930" y="545" text-anchor="middle" class="axis-label">5s</text>
    <text x="1090" y="545" text-anchor="middle" class="axis-label">10s</text>
    <text x="1250" y="545" text-anchor="middle" class="axis-label">15s</text>

    <!-- Average line -->
    <line x1="770" y1="440" x2="1290" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="1300" y="445" class="axis-label" fill="#10b981">平均: 120 QPS</text>
  </g>

  <!-- Resource Usage -->
  <g id="resource-usage">
    <rect x="50" y="600" width="420" height="270" class="card"/>
    <text x="260" y="630" text-anchor="middle" class="chart-title">资源使用情况 (Resource Usage)</text>

    <!-- CPU Usage -->
    <text x="80" y="670" class="metric-title">CPU 使用率</text>
    <rect x="80" y="680" width="360" height="30" fill="#e2e8f0" rx="4"/>
    <rect x="80" y="680" width="18" height="30" fill="#10b981" rx="4"/>
    <text x="450" y="700" text-anchor="end" class="value" fill="#10b981">5%</text>

    <!-- Memory Usage -->
    <text x="80" y="740" class="metric-title">内存使用</text>
    <rect x="80" y="750" width="360" height="30" fill="#e2e8f0" rx="4"/>
    <rect x="80" y="750" width="72" height="30" fill="#3b82f6" rx="4"/>
    <text x="450" y="770" text-anchor="end" class="value" fill="#3b82f6">48 MB</text>

    <!-- Network I/O -->
    <text x="80" y="810" class="metric-title">网络 I/O</text>
    <rect x="80" y="820" width="360" height="30" fill="#e2e8f0" rx="4"/>
    <rect x="80" y="820" width="108" height="30" fill="#f59e0b" rx="4"/>
    <text x="450" y="840" text-anchor="end" class="value" fill="#f59e0b">2.5 MB/s</text>
  </g>

  <!-- Test Configuration -->
  <g id="test-config">
    <rect x="500" y="600" width="420" height="270" class="card"/>
    <text x="710" y="630" text-anchor="middle" class="chart-title">测试配置 (Test Configuration)</text>

    <text x="530" y="670" class="label">测试工具:</text>
    <text x="750" y="670" class="value">Apache Bench (ab)</text>

    <text x="530" y="700" class="label">并发连接数:</text>
    <text x="750" y="700" class="value">10 concurrent</text>

    <text x="530" y="730" class="label">总请求数:</text>
    <text x="750" y="730" class="value">1000 requests</text>

    <text x="530" y="760" class="label">测试端点:</text>
    <text x="750" y="760" class="value">POST /score</text>

    <text x="530" y="790" class="label">测试时长:</text>
    <text x="750" y="790" class="value">8.33 seconds</text>

    <text x="530" y="820" class="label">测试环境:</text>
    <text x="750" y="820" class="value">Local (Windows)</text>

    <text x="530" y="850" class="label">服务版本:</text>
    <text x="750" y="850" class="value">risk-service v1.0</text>
  </g>

  <!-- Summary -->
  <g id="summary">
    <rect x="950" y="600" width="390" height="270" class="card"/>
    <text x="1145" y="630" text-anchor="middle" class="chart-title">测试总结 (Summary)</text>

    <circle cx="980" cy="665" r="8" class="badge-success"/>
    <text x="1000" y="670" class="label">✓ 所有性能指标达标</text>

    <circle cx="980" cy="695" r="8" class="badge-success"/>
    <text x="1000" y="700" class="label">✓ 零错误率，稳定性优秀</text>

    <circle cx="980" cy="725" r="8" class="badge-success"/>
    <text x="1000" y="730" class="label">✓ 响应时间低于50ms目标</text>

    <circle cx="980" cy="755" r="8" class="badge-success"/>
    <text x="1000" y="760" class="label">✓ 吞吐量超过100 QPS目标</text>

    <circle cx="980" cy="785" r="8" class="badge-info"/>
    <text x="1000" y="790" class="label">• CPU使用率低，资源高效</text>

    <circle cx="980" cy="815" r="8" class="badge-info"/>
    <text x="1000" y="820" class="label">• 内存占用小于50MB</text>

    <circle cx="980" cy="845" r="8" class="badge-warning"/>
    <text x="1000" y="850" class="label">⚠ 建议: 可进一步压测验证极限</text>
  </g>
</svg>
